<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Create a Klasrum account">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="container nav-container">
            <a class="logo" href="index.html">Klasrum</a>

            <nav aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="post.html">Posts</a>
                <a href="post-new.html">New Post</a>
                <a href="login.html">Login</a>
                <a class="active" href="register.html">Register</a>
            </nav>
        </div>
    </header>


/*main content*/


    <main class="container auth-container">

        <section class="form-card">

            <div class="auth-heading">
                <p class="eyebrow">Let's Start!</p>
                <h1>Create an Account</h1>
                <p>
                    Join the discussions.
                </p>
            </div>

            <form action="#" method="post">

                <div class="form-group">
                    <label for="name">Full name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="                  "
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="register-email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="register-email"
                        name="email"
                        placeholder="                  "
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="register-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="register-password"
                        name="password"
                        placeholder="                   "
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm-password">
                        Confirm password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm_password"
                        placeholder="                    "
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button
                    class="button primary-button full-button"
                    type="submit"
                >
                    Create Account
                </button>

            </form>

            <p class="form-note">
                Already have an account?
                <a href="login.html">Login here</a>.
            </p>

        </section>

    </main>








                                                                  /*Footer*/




    <footer class="site-footer">
        <div class="container">
            <p>© 2026 Klasrum. Built for IS313C.</p>
        </div>
    </footer>

</body>
</html>
